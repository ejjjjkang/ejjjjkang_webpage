id: thoughts-hate-speech
title: Hate Speech Moderation
date: March, 2026
# image: /essays/hate-speech.jpg

disclaimerText: |
  This essay is an incomplete note written for the Trust and Safety on Platform course. Opinions are my own but I used gemini for grammar and style check.

content: |
  The article by Wilson and Land, "[Hate Speech on Social Media: Content Moderation in Context](https://heinonline.org/HOL/Page?handle=hein.journals/conlr52&div=28&g_sent=1&casa_token=&collection=journals)," emphasizes the importance of considering context when developing evidence-based hate‑speech policies. When I first read the article, I wondered whether contextualized moderation had already been well established in HCI research by 2021 — that claim initially felt trivial. However, I realized the authors target a specific audience: platform policymakers and legal communities. Because the paper is a law review article, it argues that current legal frameworks may overlook important issues without empirical findings. In this sense, there may be not only a research gap among scholars within the same field but also an understanding gap between different fields when building governance for advanced technologies. This reminded me of an in‑class case study exercise where we provided feedback while role‑playing different stakeholders (e.g., regulators, parents). I struggled to simulate a regulator. I wondered what approaches could bridge these fields. One possibility is developing a shared glossary for specific cases used by policymakers, HCI researchers, and AI developers — similar to glossaries in Trust & Safety curricula.

  Returning to the authors' claim, I agree that laws can be improved by a better understanding of social and cultural norms. Platform users do not operate within static normative ethics; they continually revise standards based on the communities they trust and beliefs shaped by lived experience. As the authors note, these expectations can be demanding for platforms. Amid the current flood of AI‑generated "slop" on social media, it is unrealistic to expect platforms to shift slowly from automated systems to fully human‑driven moderation. With advanced LLM approaches, automating contextualized moderation may be feasible. At the same time, this could introduce new forms of discrimination — for example, neglecting low‑resource languages and indigenous cultures in model training — and it raises questions about how agents interpret context. Context should be analyzed from multiple perspectives rather than judged at once, so humans can oversee and remain accountable for moderation decisions.
