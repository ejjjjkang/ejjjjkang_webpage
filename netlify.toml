[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
  package = "netlify-plugin-prerender-spa"

[plugins.inputs]
  buildDir = "dist"
  # routesFile will be generated at build time by scripts/generate-prerender-routes.mjs
  routesFile = "prerender-routes.txt"